[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/glaure/xml-atlas-rs"

[workspace.dependencies]
# internal
xml-atlas-xml = { path = "crates/xml" }
xml-atlas-engine = { path = "crates/engine" }

# foundation
quick-xml = "0.42"
memchr = "2.8"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }

# ui
egui = "0.37"
eframe = "0.37"
rfd = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep the parser fast in debug builds too; UI iteration stays quick.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.xml-atlas-xml]
opt-level = 3
