[package]
name = "xml-atlas"
description = "Fast XML viewer and editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
xml-atlas-engine.workspace = true
egui.workspace = true
egui_extras = { version = "0.37", default-features = false }
eframe.workspace = true
rfd.workspace = true
log.workspace = true
env_logger.workspace = true

[lints]
workspace = true

# The desktop's light or dark preference (system_theme.rs). Already in the build through the
# accessibility support; its blocking API is part of its default features.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
