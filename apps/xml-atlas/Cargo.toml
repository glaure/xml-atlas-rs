[package]
name = "xml-atlas"
description = "Fast XML viewer and editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
xml-atlas-engine.workspace = true
egui.workspace = true
egui_extras = { version = "0.37", default-features = false }
eframe.workspace = true
rfd.workspace = true
log.workspace = true
env_logger.workspace = true
# The text view's font (fonts.rs, TEXT-25): the system's fonts and their widths. The versions
# and features egui already builds through its system font support.
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }

[dev-dependencies]
# egui's own fonts, as test data for the monospace check.
epaint_default_fonts = "0.37"

# The workspace forbids `unsafe`; this crate denies it instead, so that the one module that
# needs it, `macos_open.rs`, can allow it (`docs/decisions.md`, D26). The rest as in the
# workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

# Puts the icon into xml-atlas.exe (build.rs), so Explorer shows it for the program file.
[build-dependencies]
embed-resource = "3.0.12"

# The desktop's light or dark preference (system_theme.rs). Already in the build through the
# accessibility support; its blocking API is part of its default features.
# Files from Finder (macos_open.rs, D26). The versions already in the build through the
# clipboard and OpenGL crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
