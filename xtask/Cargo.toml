[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
# Writes the .rpm in Rust: no rpmbuild needed. gzip keeps it free of C libraries.
rpm = { version = "0.30.2", default-features = false, features = ["payload", "gzip-compression"] }
serde_json = "1.0.154"
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
